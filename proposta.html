<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Proposta</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="container">
            <h1>Proposta</h1>

            <div id="empresa"></div>

            <div style="display: flex">
                <textarea
                    id="mensagem"
                    rows="10"
                    placeholder="Mensagem da proposta..."
                    style="resize: none;"
                ></textarea>
                <div
                    style="
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        width: 20%;
                    "
                >
                    <button
                        id="gerar"
                        class="btn-principal"
                        style="margin: auto"
                    >
                        Gerar proposta
                    </button>
                    <button
                        id="whatsapp"
                        class="btn-secundario"
                        disabled
                        style="margin: auto"
                    >
                        Abrir WhatsApp
                    </button>
                    <button
                        id="visualizar-template"
                        class="btn-secundario"
                        disabled
                        style="margin: auto"
                    >
                        Ver demonstração
                    </button>
                    <button
                    id="proxima"
                    class="btn-secundario"
                    style="margin: auto;"
                    >
                        Próxima empresa →
                    </button>
                </div>
            </div>
        </main>

        <script src="js/proposta.js"></script>
    </body>
</html>
